<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyer Tutorías | Diseño Réplica con Ventanitas (Jonatan Rosas)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Anton&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d1d5db;
            color: #111;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* FLYER POSTER CONTAINER */
        .flyer-poster {
            width: 500px;
            height: 730px;
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px;
            position: relative;
            overflow: hidden;
        }

        /* 1. TOP WINDOWS XP FRAME */
        .xp-window-top {
            background: #0055ea;
            border: 3px solid #003db3;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .xp-titlebar {
            background: linear-gradient(180deg, #0058e6 0%, #2576f7 100%);
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 0.85rem;
            font-weight: 800;
            border-bottom: 2px solid #002793;
        }

        .xp-icon-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .xp-controls {
            display: flex;
            gap: 3px;
        }

        .xp-btn {
            width: 20px;
            height: 20px;
            border: 1px solid #fff;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .xp-min { background: #3c8df6; }
        .xp-max { background: #3c8df6; }
        .xp-close { background: #e76646; }

        .xp-body-inner {
            background-color: #14151b;
            border: 2px inset #444;
            margin: 4px;
            padding: 18px 12px;
            border-radius: 2px;
            text-align: center;
            position: relative;
        }

        .banner-text-main {
            font-family: 'Anton', 'Plus Jakarta Sans', sans-serif;
            color: #ff4800;
            font-size: 2.8rem;
            line-height: 0.95;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        /* 2. SUBTITLE */
        .sub-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: #0c0c0e;
            text-align: center;
            margin: 10px 0;
            letter-spacing: -0.2px;
        }

        /* 3. MIDDLE SECTION (CARDS CON VENTANITAS XP + MANGA PANEL) */
        .middle-container {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 245px;
            margin-bottom: 12px;
        }

        .cards-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 3;
            width: 80%;
        }

        .pill-card-xp {
            background-color: #0f1015;
            border: 2px solid #000000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 4px 6px 15px rgba(0,0,0,0.3);
        }

        .pill-xp-titlebar {
            background: linear-gradient(180deg, #0058e6 0%, #2576f7 100%);
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
        }

        .pill-body {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pill-dot {
            color: #ffffff;
            font-size: 1.3rem;
            line-height: 0;
        }

        .pill-text {
            color: #ff4800;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 0.2px;
        }

        /* MANGA BACKGROUND PANEL ON RIGHT */
        .manga-panel-art {
            position: absolute;
            right: -10px;
            top: -15px;
            width: 230px;
            height: 275px;
            object-fit: cover;
            border-left: 2px solid #000;
            z-index: 1;
            mix-blend-mode: multiply;
            filter: contrast(1.1);
        }

        /* 4. BOTTOM CONTACT CARD */
        .bottom-card {
            background-color: #0f1015;
            border: 2px solid #000000;
            border-radius: 14px;
            padding: 16px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 4;
            position: relative;
        }

        .qr-wrapper {
            background-color: #ffffff;
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #000;
            width: 95px;
            height: 95px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrapper img {
            width: 100%;
            height: 100%;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .url-link {
            color: #ff4800;
            font-size: 1.05rem;
            font-weight: 800;
            text-decoration: none;
            word-break: break-all;
        }

        .phone-number {
            color: #ffffff;
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- FLYER POSTER CONTAINER -->
    <div class="flyer-poster">

        <!-- 1. TOP WINDOWS XP FRAME -->
        <div class="xp-window-top">
            <div class="xp-titlebar">
                <div class="xp-icon-box">
                    <span>💻</span>
                    <span>hyw_jon.exe</span>
                </div>
                <div class="xp-controls">
                    <span class="xp-btn xp-min">_</span>
                    <span class="xp-btn xp-max">□</span>
                    <span class="xp-btn xp-close">X</span>
                </div>
            </div>
            <div class="xp-body-inner">
                <div class="banner-text-main">
                    TUTORÍAS DE<br>PROGRAMACIÓN
                </div>
            </div>
        </div>

        <!-- 2. SUBTITLE -->
        <h2 class="sub-title">Para chicos de Univ. de Pilar</h2>

        <!-- 3. MIDDLE SECTION (CARDS VENTANITAS XP + MANGA ART) -->
        <div class="middle-container">
            <div class="cards-stack">
                <div class="pill-card-xp">
                    <div class="pill-xp-titlebar">
                        <span>Prog_Basica.exe</span>
                        <div class="xp-controls">
                            <span class="xp-btn xp-close">x</span>
                        </div>
                    </div>
                    <div class="pill-body">
                        <span class="pill-dot">•</span>
                        <span class="pill-text">Programación Básica e Intermedia</span>
                    </div>
                </div>

                <div class="pill-card-xp">
                    <div class="pill-xp-titlebar">
                        <span>Objetos_POO.exe</span>
                        <div class="xp-controls">
                            <span class="xp-btn xp-close">x</span>
                        </div>
                    </div>
                    <div class="pill-body">
                        <span class="pill-dot">•</span>
                        <span class="pill-text">POO (Orientada a Objetos)</span>
                    </div>
                </div>

                <div class="pill-card-xp">
                    <div class="pill-xp-titlebar">
                        <span>Estructura_Datos.exe</span>
                        <div class="xp-controls">
                            <span class="xp-btn xp-close">x</span>
                        </div>
                    </div>
                    <div class="pill-body">
                        <span class="pill-dot">•</span>
                        <span class="pill-text">Estructura de Datos</span>
                    </div>
                </div>
            </div>

            <!-- MANGA ILLUSTRATION BACKGROUND -->
            <img src="manga_panel.jpg" class="manga-panel-art" alt="Manga Character Art">
        </div>

        <!-- 4. BOTTOM CONTACT CARD WITH QR -->
        <div class="bottom-card">
            <div class="qr-wrapper">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://jonatanrosassss.github.io/web_tutorias/" alt="QR Code Web Tutorias">
            </div>
            <div class="contact-details">
                <a href="https://jonatanrosassss.github.io/web_tutorias/" target="_blank" class="url-link">jonatanrosassss.github.io/web_tutorias</a>
                <div class="phone-number">WhatsApp: 11 7369-0564</div>
            </div>
        </div>

    </div>

</body>
</html>
